<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<meta name="description" content="执业药师《中药二》单味药章节归属记忆游戏 · 407 味药 · 44 个章节，自适应出题">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>中药二 · 单味药章节闯关</title>
<style>
  :root{
    --bg:#0f1420; --panel:#171e2e; --panel2:#1e2739; --line:#2b3651;
    --txt:#e8eefc; --dim:#8b9bb8; --acc:#4f8cff; --acc2:#2fd3a0;
    --ok:#2fd3a0; --bad:#ff5d6c; --warn:#ffb648;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(1200px 700px at 50% -10%,#1b2740 0%,var(--bg) 55%);
    color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;align-items:flex-start;
    padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  #app{width:100%;max-width:560px;min-width:0}

  /* ---------- 窄屏适配 ---------- */
  @media (max-width:430px){
    body{padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
    .drug{font-size:36px;letter-spacing:2px}
    .drug.long{font-size:29px}
    .opt{padding:12px 12px;font-size:14.5px}
    .stats{gap:6px}
    .stat{padding:8px 5px}
    .stat b{font-size:15px}
    .stat span{font-size:9.5px}
    .card{padding:18px 14px 14px;border-radius:15px}
    .io .btn{font-size:11.5px;padding:9px 2px}
  }
  @media (max-height:640px){
    .drug{margin:2px 0}
    .ask{margin-bottom:12px}
  }

  /* ---------- 顶栏 ---------- */
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .title{font-size:15px;font-weight:700;letter-spacing:.5px;flex:1;min-width:140px}
  .title small{display:block;font-weight:400;font-size:11px;color:var(--dim);letter-spacing:0}
  .btn{
    background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    padding:7px 13px;border-radius:9px;font-size:13px;cursor:pointer;transition:.15s;
    font-family:inherit;
  }
  .btn:hover{background:#26314a;border-color:#3d4b6d}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent}
  .btn.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}

  /* ---------- 进度 ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 8px;text-align:center;min-width:0;overflow:hidden}
  .stat b{display:block;font-size:17px;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap}
  .stat span{font-size:10.5px;color:var(--dim)}
  .stat.a b{color:var(--acc2)} .stat.b b{color:var(--warn)} .stat.c b{color:var(--bad)}

  /* ---------- 进度条 ---------- */
  .bar{height:5px;background:#232d43;border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}

  /* ---------- 题卡 ---------- */
  .card{
    background:linear-gradient(180deg,var(--panel),#141b2a);
    border:1px solid var(--line);border-radius:18px;padding:22px 18px 18px;
    box-shadow:0 18px 50px -28px #000;
  }
  .qmeta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-bottom:14px}
  .qmeta .tm{font-variant-numeric:tabular-nums}
  .drug{
    text-align:center;font-size:44px;font-weight:800;letter-spacing:3px;
    margin:6px 0 4px;line-height:1.2;
  }
  .drug.long{font-size:34px;letter-spacing:2px}
  .ask{text-align:center;color:var(--dim);font-size:12.5px;margin-bottom:20px}

  /* ---------- 选项 ---------- */
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;align-items:center;gap:11px;
    background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;
    padding:13px 14px;font-size:15px;cursor:pointer;transition:.13s;text-align:left;
    color:var(--txt);font-family:inherit;width:100%;
  }
  .opt:hover:not(.lock){border-color:#46587f;background:#242f47}
  .opt .k{
    flex:0 0 24px;height:24px;border-radius:7px;background:#2c3855;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:#a9bade;
  }
  .opt .t{flex:1;line-height:1.3}
  .opt .tag{font-size:10.5px;color:var(--dim);display:block;margin-top:2px}
  .opt.lock{cursor:default}
  .opt.ok{border-color:var(--ok);background:rgba(47,211,160,.13)}
  .opt.ok .k{background:var(--ok);color:#06251c}
  .opt.bad{border-color:var(--bad);background:rgba(255,93,108,.13)}
  .opt.bad .k{background:var(--bad);color:#2b0004}
  .opt.dim{opacity:.42}

  /* ---------- 反馈 ---------- */
  .fb{margin-top:15px;font-size:13px;line-height:1.65;display:none}
  .fb.show{display:block;animation:fade .22s}
  @keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .fb .h{font-weight:700;font-size:14.5px;margin-bottom:6px}
  .fb .h.ok{color:var(--ok)} .fb .h.bad{color:var(--bad)}
  .fb .row{color:var(--dim);margin-top:3px}
  .fb .row b{color:var(--txt);font-weight:600}
  .fb .eff{
    margin-top:9px;padding:9px 11px;background:#131a29;border-left:2.5px solid var(--acc);
    border-radius:0 8px 8px 0;color:#c6d3ee;font-size:12.5px
  }
  .fb .eff i{color:var(--dim);font-style:normal;font-size:11px}

  /* 连击徽标 */
  .combo{
    display:inline-block;margin-left:8px;padding:2px 9px;border-radius:99px;
    background:linear-gradient(90deg,#ffb648,#ff7a45);color:#2b1400;
    font-size:11px;font-weight:800;letter-spacing:.5px;
    animation:pop .3s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

  /* 掌握度进度条 */
  .wbar{display:flex;align-items:center;gap:8px;margin-top:11px}
  .wtag{font-size:10.5px;color:var(--dim);flex:0 0 auto}
  .wtrack{flex:1 1 auto;min-width:0;height:6px;background:#232d43;border-radius:99px;overflow:hidden}
  .wtrack>i{display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,#4f8cff,#2fd3a0);transition:width .35s cubic-bezier(.2,.8,.2,1)}
  .wtrack>i.hi{background:linear-gradient(90deg,#2fd3a0,#7bea5e)}
  .wlab{flex:0 0 auto;font-size:10.5px;color:var(--dim);min-width:44px;text-align:right}
  .wlab.hi{color:var(--ok);font-weight:700}

  /* ---------- 下一题 ---------- */
  .next{
    margin-top:16px;width:100%;padding:13px;border-radius:12px;border:0;cursor:pointer;
    background:linear-gradient(90deg,var(--acc),#6b6cff);color:#fff;font-size:15px;font-weight:700;
    font-family:inherit;display:none;
  }
  .next.show{display:block;animation:fade .2s}
  .next:active{transform:scale(.985)}

  /* ---------- 结束 ---------- */
  .done{text-align:center;padding:8px 4px}
  .done h2{margin:6px 0 4px;font-size:24px}
  .done .sub{color:var(--dim);font-size:13px;margin-bottom:22px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;text-align:left}
  .cell{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .cell span{font-size:11px;color:var(--dim);display:block}
  .cell b{font-size:19px;font-variant-numeric:tabular-nums}

  .weak{text-align:left;margin-bottom:18px}
  .weak h3{font-size:13px;color:var(--dim);font-weight:600;margin:0 0 9px}
  .wrow{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:13px}
  .wrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrow .cnt{font-variant-numeric:tabular-nums;color:var(--warn);font-size:12px}

  .empty{text-align:center;color:var(--dim);font-size:13px;padding:26px 0}
  .kbd{background:#2c3855;border-radius:5px;padding:1px 6px;font-size:11.5px;color:#b9c8e8}
  .io{display:flex;gap:8px;margin-top:14px}
  .io .btn{flex:1 1 0;min-width:0;font-size:12.5px;padding:9px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- 命题权重面板 ---------- */
  .sc{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .sc>summary{
    cursor:pointer;padding:11px 14px;font-size:12.5px;color:var(--dim);list-style:none;
    display:flex;align-items:center;gap:6px;user-select:none;
  }
  .sc>summary::-webkit-details-marker{display:none}
  .sc>summary:before{content:'▸';font-size:11px;transition:.2s;color:#5f6d8c}
  .sc[open]>summary:before{transform:rotate(90deg)}
  .sc>summary:hover{color:var(--txt)}
  .scin{padding:2px 14px 10px}
  .scrow{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11.5px}
  .scn{flex:0 0 96px;color:#c6d3ee;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .scb{flex:1 1 auto;min-width:0;height:7px;background:#232d43;border-radius:99px;overflow:hidden}
  .scb>i{display:block;height:100%;background:linear-gradient(90deg,#4f8cff,#2fd3a0);border-radius:99px}
  .scv{flex:0 0 72px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;font-size:10.5px}
  .scnote{padding:0 14px 12px;font-size:10.5px;color:#556181;line-height:1.6}
  .savehint{font-size:11px;color:#5f6d8c;margin-top:8px;text-align:center;line-height:1.6}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:#2fd3a0;color:#06251c;font-size:13px;font-weight:600;
    padding:10px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:99;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  footer{margin-top:18px;text-align:center;font-size:11px;color:#556181;line-height:1.7}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

const SECTIONS = [...new Set(DRUGS.map(d => d.s))];          // 44
const CHAP_OF_SEC = new Map();                               // 节 → 章
DRUGS.forEach(d => CHAP_OF_SEC.set(d.s, d.c));
const SEC_DRUGS = new Map();                                 // 节 → 药名数组
SECTIONS.forEach(s => SEC_DRUGS.set(s, DRUGS.filter(d => d.s === s).map(d => d.n)));
DRUGS.forEach(d => { CHAP_DRUG_N[d.c] = (CHAP_DRUG_N[d.c] || 0) + 1; });

/* 易混份量：药味越多，作为干扰项越活跃 */
const SEC_WEIGHT = new Map(SECTIONS.map(s => [s, Math.sqrt(SEC_DRUGS.get(s).length)]));

/* 每味药的真题分值 → 章分值 */
function scoreOf(drug){
  const v = CHAP_SCORE_2025[drug.c];
  return (v === undefined ? 1 : v);
}
/* 该药的真题系数 */
function scoreFactor(drug){
  if(weightMode === 'off') return 1;
  const s = scoreOf(drug);
  const n = CHAP_DRUG_N[drug.c] || 1;
  const density = s / n;                       // 分值密度：分/味
  if(weightMode === 'density'){
    // 纯密度：单药概率 ∝ 分值 ÷ 药味数（每章分值都 ≥1，密度必 >0）
    return density;
  }
  if(weightMode === 'root'){
    // 密度开方：保留方向，但压缩极差，避免 3 味小章刷屏
    return Math.sqrt(density);
  }
  // blend：按 √药味数 折中
  return Math.max(0.3, (SCORE_FACTOR_MIN + s) / Math.sqrt(n));
}
/* 整章加权后的题量占比，用于界面展示 */
function chapterShares(){
  const m = {};
  DRUGS.forEach(d => { m[d.c] = (m[d.c] || 0) + scoreFactor(d); });
  const total = Object.values(m).reduce((a,b)=>a+b,0);
  return Object.entries(m).map(([c,v]) => ({c, pct: v/total}))
    .sort((a,b)=>b.pct-a.pct);
}

/* ---------- 存储 ---------- */
/* 实测：file:// 下 localStorage 可用，但按「浏览器+协议」共享，不按目录隔离；
   清缓存/换浏览器会丢。故：主存 localStorage，另存一份到会话外的备份 key。 */
const LS_BAK = LS + '_bak';

function parseState(raw){
  if(!raw) return null;
  try{
    const o = JSON.parse(raw);
    if(!o || !o.cards) return null;
    return o;
  }catch(e){ return null; }
}
function load(){
  // 优先主存，其次备份
  let o = parseState(localStorage.getItem(LS));
  if(!o) o = parseState(localStorage.getItem(LS_BAK));
  return o;
}
function save(){
  try{
    const s = JSON.stringify(state);
    localStorage.setItem(LS, s);
    localStorage.setItem(LS_BAK, s);   // 双写备份
  }catch(e){}
}
/* ---------- 导出 / 导入 ---------- */
function exportJSON(){
  const blob = new Blob([JSON.stringify(state,null,0)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  a.href = URL.createObjectURL(blob);
  a.download = `中药二章节闯关_进度_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  toast('已导出进度文件');
}
function importJSON(file){
  const r = new FileReader();
  r.onload = () => {
    const o = parseState(r.result);
    if(!o){ toast('文件无法识别'); return; }
    const merged = Math.max(
      DRUGS.filter(d=>o.cards[d.n]).length, 0
    );
    if(!confirm('导入将覆盖当前进度（当前已练 ' + DRUGS.filter(d=>state.cards[d.n].n>0).length + ' 味，待导入 ' + merged + ' 味）。继续？')) return;
    state = o;
    DRUGS.forEach(d => { if(!state.cards[d.n]) state.cards[d.n]={w:2.5,n:0,c:0,t:0,last:0,streak:0}; });
    save(); render(); toast('进度已导入');
  };
  r.readAsText(file);
}
function toast(msg){
  const t = $('#toast');
  if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._id);
  toast._id = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------- 状态 ---------- */
let state = load() || {
  cards: {},        // 药名 → {w:权重, n:答题次数, c:答对次数, t:累计用时ms, last:上次时间戳, streak:连对}
  total: 0, right: 0, streakBest: 0, streak: 0,
  startAt: Date.now()
};
/* 补齐无记录药的初始权重 */
DRUGS.forEach(d => { if(!state.cards[d.n]) state.cards[d.n] = {w:2.5,n:0,c:0,t:0,last:0,streak:0}; });
/* 恢复上次的加权模式 */
if(state.weightMode && ['density','root','blend','off'].includes(state.weightMode)) weightMode = state.weightMode;
/* 模式切换后立即持久化（save 定义在前，此处直接写） */
(function(){ state.weightMode = weightMode; })();

/* ---------- 运行时 ---------- */
let cur = null;         // {drug, opts:[{text,isRight,sub}], t0}
let answered = false;
let timerId = null;

/* ---------- 工具 ---------- */
const $ = sel => document.querySelector(sel);
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function pct(n,d){ return d? Math.round(n/d*100) : 0; }
function fmt(ms){ return (ms/1000).toFixed(1); }

/* ---------- 出题：加权抽取 ---------- */
function pickDrug(){
  // 收集还有未掌握项的药
  const pool = DRUGS.filter(d => state.cards[d.n].w > MASTER_THRESHOLD);
  const src = pool.length ? pool : DRUGS;
  let sum = 0;
  // 最终权重 = 掌握度权重 × 真题分值系数
  const ws = src.map(d => {
    const w = Math.max(state.cards[d.n].w, 0.01) * scoreFactor(d);
    sum += w; return w;
  });
  let r = Math.random() * sum;
  for(let i=0;i<src.length;i++){ r -= ws[i]; if(r <= 0) return src[i]; }
  return src[src.length-1];
}

/* ---------- 出题：构造 5 个选项 ---------- */
function buildOptions(drug){
  const right = drug.s;
  const rightChap = drug.c;
  const set = new Set([right]);
  const picked = [{text:right, isRight:true, sub:rightChap}];

  // 1) 同章相邻节（最难、最有价值）：取同章其他节，按与正确节在章内顺序的距离排序
  const sameChap = [...new Set(DRUGS.filter(x=>x.c===rightChap).map(x=>x.s))].filter(s=>s!==right);
  if(sameChap.length){
    // 距离：右节在章内的位置
    const order = [...new Set(DRUGS.filter(x=>x.c===rightChap).map(x=>x.s))];
    const ri = order.indexOf(right);
    const sorted = sameChap.slice().sort((a,b)=>Math.abs(order.indexOf(a)-ri)-Math.abs(order.indexOf(b)-ri));
    // 取最多 3 个（随机从前 4 个里挑，避免千篇一律）
    const near = sorted.slice(0, Math.min(4, sorted.length));
    shuffle(near).slice(0, Math.min(3, near.length)).forEach(s=>{
      if(!set.has(s)){ set.add(s); picked.push({text:s,isRight:false,sub:CHAP_OF_SEC.get(s)}); }
    });
  }

  // 2) 不够则加入其他章的高频节（按药味数加权）
  if(picked.length < OPTS){
    const others = SECTIONS.filter(s => !set.has(s) && CHAP_OF_SEC.get(s) !== rightChap);
    const weighted = others.map(s=>[s, SEC_WEIGHT.get(s)]);
    while(picked.length < OPTS && weighted.length){
      let sum = weighted.reduce((a,b)=>a+b[1],0), r = Math.random()*sum, k=0;
      for(;k<weighted.length;k++){ r -= weighted[k][1]; if(r<=0) break; }
      k = Math.min(k, weighted.length-1);
      const s = weighted[k][0];
      weighted.splice(k,1);
      if(!set.has(s)){ set.add(s); picked.push({text:s,isRight:false,sub:CHAP_OF_SEC.get(s)}); }
    }
  }
  // 3) 兜底
  const remain = SECTIONS.filter(s=>!set.has(s));
  while(picked.length < OPTS && remain.length){
    const s = remain.splice(Math.random()*remain.length|0,1)[0];
    set.add(s); picked.push({text:s,isRight:false,sub:CHAP_OF_SEC.get(s)});
  }
  return shuffle(picked);
}

/* ---------- 渲染 ---------- */
function render(){
  const c = state.cards;
  const done = DRUGS.filter(d=>c[d.n].n>0).length;
  const mastered = DRUGS.filter(d=>c[d.n].n>0 && c[d.n].w<=MASTER_THRESHOLD).length;
  const weak = DRUGS.filter(d=>c[d.n].n>0 && c[d.n].w>1.5).length;

  $('#app').innerHTML = `
    <div class="topbar">
      <div class="title">中药二 · 单味药章节闯关
        <small>407 味 · 44 个章节 · 连对 ${state.streak} · 最高 ${state.streakBest}</small>
      </div>
      <button class="btn ${weightMode!=='off'?'on':'ghost'}" id="btnWeight" title="点击切换加权模式：纯密度 → 密度开方 → 折中 → 关闭">
        ${({off:'加权关闭',density:'分值密度',root:'密度开方',blend:'折中'})[weightMode]}
      </button>
      <button class="btn ghost" id="btnReset">重来</button>
    </div>

    <div class="stats">
      <div class="stat a"><b>${mastered}</b><span>已掌握</span></div>
      <div class="stat b"><b>${weak}</b><span>待加强</span></div>
      <div class="stat"><b>${done}<i style="font-size:11px;color:#8b9bb8">/407</i></b><span>已练过</span></div>
      <div class="stat c"><b>${pct(state.right,state.total)}%</b><span>正确率</span></div>
    </div>
    <div class="bar"><i style="width:${pct(mastered,DRUGS.length)}%"></i></div>

    <div class="card" id="card"></div>

    ${weightMode!=='off' ? `<details class="sc"><summary>命题权重（按「每味药分值密度」排序）</summary>
      <div class="scin">${chapterShares().map(x=>{
        const s = CHAP_SCORE_2025[x.c];
        const n = CHAP_DRUG_N[x.c] || 1;
        const dens = (s/n);
        const w = Math.max(2, Math.round(x.pct*100*1.6));
        return `<div class="scrow">
          <span class="scn">${x.c.replace(/^第.+?章\s*/,'')}</span>
          <span class="scb"><i style="width:${w}%"></i></span>
          <span class="scv">${s}分/${n}味 ${dens.toFixed(2)}</span>
        </div>`;
      }).join('')}</div>
      <div class="scnote">${({
        density:'分值密度模式（默认）：单药概率 ∝ 分值 ÷ 药味数。例：10味考5分(0.50) 比 20味考1分(0.05) 多出 10 倍。',
        root:'密度开方：保留「分值密度」方向，但压缩极差，避免 3 味小章刷屏。',
        blend:'折中模式：单药概率 ∝ 分值 ÷ √药味数，最平缓。'
      })[weightMode]}</div>
    </details>` : ''}

    <div class="io">
      <button class="btn" id="btnExport">⬇ 导出进度</button>
      <button class="btn" id="btnImport">⬆ 导入进度</button>
      <input type="file" id="fileImport" accept=".json,application/json" style="display:none">
    </div>
    <div class="savehint">进度自动保存在本浏览器，关掉网页不会丢<br>但清理浏览器数据 / 换浏览器会丢 —— 重要进度请点「导出」备份</div>

    <footer>
      键盘：<span class="kbd">1</span>–<span class="kbd">5</span> 选答案　<span class="kbd">Enter</span> 下一题<br>
      答错或答慢会加快重考，答对且快会延后
    </footer>
  `;
  $('#btnWeight').onclick = () => {
    const order = ['density','root','blend','off'];
    weightMode = order[(order.indexOf(weightMode)+1) % order.length];
    state.weightMode = weightMode;
    save(); render(); nextQuestion();
  };
  $('#btnExport').onclick = exportJSON;
  $('#btnImport').onclick = () => $('#fileImport').click();
  $('#fileImport').onchange = e => {
    const f = e.target.files[0];
    if(f) importJSON(f);
    e.target.value = '';
  };
  $('#btnReset').onclick = () => {
    if(confirm('清空全部进度，重新开始？')){
      localStorage.removeItem(LS);
      state = {cards:{}, total:0, right:0, streakBest:0, streak:0, startAt:Date.now()};
      DRUGS.forEach(d => state.cards[d.n]={w:2.5,n:0,c:0,t:0,last:0,streak:0});
      save(); render(); nextQuestion();
    }
  };
  nextQuestion();
}

/* ---------- 出下一题 ---------- */
function nextQuestion(){
  answered = false;
  const drug = pickDrug();
  const opts = buildOptions(drug);
  cur = {drug, opts, t0: performance.now()};

  const card = $('#card');
  const isLong = drug.n.length >= 4;
  card.innerHTML = `
    <div class="qmeta">
      <span>第 ${state.total+1} 题</span>
      <span class="tm" id="tm">0.0s</span>
    </div>
    <div class="drug ${isLong?'long':''}">${drug.n}</div>
    <div class="ask">属于下列哪一类？</div>
    <div class="opts" id="opts">
      ${opts.map((o,i)=>`
        <button class="opt" data-i="${i}">
          <span class="k">${i+1}</span>
          <span class="t">${o.text}</span>
        </button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="next" id="next">下一题 →</button>
  `;
  card.querySelectorAll('.opt').forEach(b=>{
    b.onclick = () => answer(parseInt(b.dataset.i,10));
  });
  $('#next').onclick = nextQuestion;

  // 计时
  clearInterval(timerId);
  timerId = setInterval(()=>{
    const el = $('#tm');
    if(el && !answered) el.textContent = fmt(performance.now()-cur.t0)+'s';
  }, 100);
}

/* ---------- 判题 ---------- */
function answer(idx){
  if(answered) return;
  answered = true;
  clearInterval(timerId);

  const elapsed = performance.now() - cur.t0;
  const sec = elapsed/1000;
  const opts = cur.opts;
  const chosen = opts[idx];
  const isRight = chosen.isRight;
  const card = state.cards[cur.drug.n];

  /* —— 权重更新（灵敏版）——
     答对：按速度分三档，快答骤降、慢答轻降
     答错：一律重罚，且越是"已接近掌握"的药，罚得越狠（防止侥幸蒙对后被埋没） */
  let delta, speedTag;
  if(isRight){
    if(sec <= 2.0)      { delta = -1.10; speedTag = '快'; }   // 秒答，基本已掌握
    else if(sec <= 4.5) { delta = -0.62; speedTag = '稳'; }   // 正常思考
    else                { delta = -0.28; speedTag = '慢'; }   // 磨出来的，降得少
    // 连对加速遗忘：连续答对让权重更快见底
    delta -= Math.min(card.streak, 4) * 0.16;
    card.streak++;
  }else{
    delta = 2.6 + (card.w <= 0.8 ? 1.2 : 0);   // 已近乎掌握却答错 → +3.8
    card.streak = 0;
  }
  card.w = Math.min(MAX_WEIGHT, Math.max(0.05, card.w + delta));
  card.n++; card.t += elapsed; card.last = Date.now();
  if(isRight) card.c++;

  state.total++; if(isRight){ state.right++; state.streak++; state.streakBest=Math.max(state.streakBest,state.streak);} else state.streak=0;
  save();

  /* —— 视觉反馈 —— */
  const btns = document.querySelectorAll('.opt');
  btns.forEach((b,i)=>{
    b.classList.add('lock');
    if(opts[i].isRight) b.classList.add('ok');
    else if(i===idx) b.classList.add('bad');
    else b.classList.add('dim');
  });

  // 灵敏度：连击特效 + 状态提示
  const masteredNow = card.w <= MASTER_THRESHOLD;
  const dispW = card.w <= MASTER_THRESHOLD ? '已掌握' :
                card.w <= 1.2 ? '快记住了' :
                card.w <= 2.5 ? '还要练' : '重点复习';

  const fb = $('#fb');
  fb.className = 'fb show';
  fb.innerHTML = `
    <div class="h ${isRight?'ok':'bad'}">
      ${isRight? '✓ 正确' : '✗ 答案：' + cur.drug.s}
      <span style="font-weight:400;color:#8b9bb8;font-size:12px">${sec.toFixed(1)}s · ${isRight?speedTag+'答':'错'}</span>
      ${state.streak>=3 && isRight ? `<span class="combo">连对 ${state.streak}</span>` : ''}
    </div>
    <div class="row">归属：<b>${cur.drug.c} › ${cur.drug.s}</b></div>
    ${!isRight ? `<div class="row">你选的「${chosen.text}」属于 <b>${chosen.sub}</b></div>` : ''}
    ${cur.drug.e ? `<div class="eff"><i>功效</i><br>${cur.drug.e}</div>` : ''}
    <div class="wbar">
      <span class="wtag">掌握度</span>
      <span class="wtrack"><i class="${masteredNow?'hi':''}" style="width:${Math.round((1-card.w/MAX_WEIGHT)*100)}%"></i></span>
      <span class="wlab ${masteredNow?'hi':''}">${dispW}</span>
    </div>
  `;

  const nextBtn = $('#next');
  nextBtn.classList.add('show');
  nextBtn.focus();

  // 更新顶栏统计（不整页重绘，保留当前题）
  updateStats();
}

function updateStats(){
  const c = state.cards;
  const done = DRUGS.filter(d=>c[d.n].n>0).length;
  const mastered = DRUGS.filter(d=>c[d.n].n>0 && c[d.n].w<=MASTER_THRESHOLD).length;
  const weak = DRUGS.filter(d=>c[d.n].n>0 && c[d.n].w>1.5).length;
  const st = document.querySelectorAll('.stat b');
  if(st.length===4){
    st[0].textContent = mastered;
    st[1].textContent = weak;
    st[2].innerHTML = done + '<i style="font-size:11px;color:#8b9bb8">/407</i>';
    st[3].textContent = pct(state.right,state.total)+'%';
  }
  const bar = document.querySelector('.bar>i');
  if(bar) bar.style.width = pct(mastered,DRUGS.length)+'%';
  const t = document.querySelector('.title small');
  if(t) t.textContent = `407 味 · 44 个章节 · 连对 ${state.streak} · 最高 ${state.streakBest}`;
}

/* ---------- 键盘 ---------- */
document.addEventListener('keydown', e=>{
  if(e.key>='1' && e.key<='5'){
    const i = parseInt(e.key,10)-1;
    const b = document.querySelectorAll('.opt')[i];
    if(b && !answered) b.click();
  }else if(e.key==='Enter'){
    const n = $('#next');
    if(n && n.classList.contains('show')) n.click();
  }
});

/* ---------- 启动 ---------- */
render();
</script>
</body>
